[project]
name = "dentists-tunisia-scraper"
version = "0.1.0"
description = "Collecte responsable de fiches publiques de dentistes en Tunisie depuis des sources publiques actives."
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "fastapi>=0.115",
  "httpx>=0.27",
  "pandas>=2",
  "openpyxl>=3.1",
  "pydantic>=2",
  "plotly>=6",
  "psycopg[binary]>=3",
  "python-dotenv>=1",
  "python-multipart>=0.0.9",
  "pyyaml>=6",
  "rapidfuzz>=3",
  "sqlalchemy>=2",
  "tenacity>=8",
  "typer>=0.12",
  "uvicorn[standard]>=0.30"
]

[project.optional-dependencies]
dev = ["pytest>=8"]
ocr = ["paddleocr>=2.7", "paddlepaddle>=2.6"]
osm = ["osmium>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]
