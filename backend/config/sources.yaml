  - id: "goafricaonline"
    name: "Go Africa Online"
    enabled: true
    priority: 90
    parser: "generic_profile"
    start_urls:
      - "https://www.goafricaonline.com/tn/annuaire/dentistes"
    profile_url_regex: "/tn/[0-9]+-[^#?]+$"
    notes: "Annuaire entreprises/cabinets dentaires, volume modeste mais fiches détaillées."

  - id: "orthodontiste_tn"
    name: "Orthodontiste.tn"
    enabled: true
    priority: 95
    parser: "direct_listing"
    start_urls:
      - "https://orthodontiste.tn/dr/"
    notes: "Liste directe des orthodontistes avec téléphone/adresse dans la page."

  - id: "para_doctor"
    name: "Para Doctor"
    enabled: true
    priority: 100
    parser: "direct_listing"
    start_urls:
      - "https://www.para-doctor.tn/dentiste-a-ksar-hellal/"
    notes: "Première page dentistes analysée; autres villes à ajouter après validation."

  - id: "sante_tunisie"
    name: "Santé Tunisie"
    enabled: true
    priority: 20
    parser: "generic_profile"
    start_urls:
      - "https://santetunisie.rns.tn/fr/component/annuaire/?view=dentistes"
    notes: "Accès HTTP direct instable durant les tests; garder désactivé jusqu'à validation."

  - id: "bonnes_adresses"
    name: "Bonnes Adresses"
    enabled: true
    priority: 80
    parser: "generic_profile"
    start_urls:
      - "https://www.bonnes-adresses.tn/dentistes-en-tunisie.htm"
    notes: "Page observée surtout comme page de catégorie; activer après vérification des liens de fiches."
