sources:
  - id: "med.tn"
    name: "Med.tn"
    enabled: true
    priority: 30
    parser: "med_tn"
    notes: "Source pratique, pages publiques + endpoint AJAX public détecté."

  - id: "lerdvmedical"
    name: "Le RDV Medical"
    enabled: true
    priority: 40
    parser: "generic_profile"
    start_urls:
      - "https://lerdvmedical.tn/medecin-dentiste-a-tunis"
    profile_url_regex: "/archives/doctors/[^#?]+$"
    listing_url_templates:
      Tunis:
        - "https://lerdvmedical.tn/medecin-dentiste-a-tunis"

  - id: "tunisie_medicale"
    name: "Tunisie Médicale"
    enabled: true
    priority: 50
    parser: "generic_profile"
    max_pages: 250
    start_urls:
      - "https://tunisie-medicale.com/index.php/dentiste"
    profile_url_regex: "/index\\.php/dentiste/[0-9]+-[^#?]+$"

